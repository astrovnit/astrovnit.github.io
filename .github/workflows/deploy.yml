name: Deploy to GitHub Pages

on:
  push:
    branches:
      - aac-development
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site for GitHub Pages
        run: npm run build:pages

      - name: Verify static output
        run: |
          test -f .output/public/index.html || { echo "ERROR: .output/public/index.html is missing!"; exit 1; }
          test -f .output/public/404.html || { echo "ERROR: .output/public/404.html is missing!"; exit 1; }
          test -d .output/public/assets || { echo "ERROR: .output/public/assets is missing!"; exit 1; }
          echo "Static build verified successfully."

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
